<!DOCTYPE html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tailwind CSS</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <button
      class="p-10 bg-green-300 hover:bg-green-700 hover:text-white rounded-lg m-10 transition-colors duration-200"
    >
      저장하기
    </button>

    <div
      class="w-8 h-8 border-6 border-blue-400 rounded-full border-t-transparent m-3 animate-spin"
    ></div>

    <div
      class="w-20 border border-gray-400 rounded-sm text-center m-10 relative"
    >
      <span class="text-lg">메일함</span>
      <span
        class="h-3 w-3 bg-red-500 rounded-full absolute -right-1 -top-1 animate-ping"
      ></span>
    </div>

    <div class="w-20 h-10 bg-gray-200 rounded-lg animate-pulse"></div>

    <div class="m-10 text-3xl animate-bounce">⬆️</div>
  </body>
</html>
