<!DOCTYPE html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tailwind CSS</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <h1 class="text-3xl font-bold underline bg-pink-100">Hello world!</h1>

    <div class="w-50 h-50 bg-blue-200">50 * 4px</div>
    <div class="w-[234px] h-[234px] bg-blue-100">234 * 234</div>

    <div class="max-w-5xl bg-blue-300">max-w-5xl</div>

    <div
      class="w-30 h-30 bg-pink-200 border-gray-500 border-8 rounded-md"
    ></div>

    <div class="bg-yellow-300 w-30 h-30 p-10 m-10">안녕하세요</div>

    <h1 class="font-sans text-sm text-red-200">Hello world</h1>
    <h1 class="font-serif text-xl text-center">Hello world</h1>
    <h1 class="font-mono text-base">Hello world</h1>
  </body>
</html>
