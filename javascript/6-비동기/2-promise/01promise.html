<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      function question() {
        return new Promise((resolve, reject) => {
          setTimeout(() => {
            const result = prompt("전주 최고의 맛집은?");
            if (result === "허가낸닭발") {
              //성공
              // resolve("정답!!!!");
              resolve(() => {
                alert("정답");
              });
            } else {
              //실패
              reject("떙~~~~");
            }
          }, 1000);
        });
      }
      question()
        .then((result) => {
          // console.log("✅", result);
          result(); // 함수를 보낼 수도 있음
        })
        .catch((result) => {
          console.error("❌", result);
        });
    </script>
  </body>
</html>
