<!DOCTYPE html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>실습</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <div
      class="w-72 p-7 border border-gray-200 shadow-lg rounded-lg mx-auto mt-10 flex flex-col justify-center items-center gap-4"
    >
      <h2 class="sr-only">프로필 카드</h2>

      <div class="w-20 h-20 bg-blue-500 rounded-full mx-auto"></div>
      <div class="flex flex-col justify-center items-center gap-2">
        <h3 class="text-xl font-bold">김개발자</h3>
        <p class="text-gray-500">Frontend Developer</p>
      </div>

      <p class="text-gray-400">팔로워 1,234명</p>
    </div>

    <div
      class="w-80 mx-auto mt-20 border border-green-500 p-4 rounded-md bg-green-100"
    >
      <h2 class="sr-only">성공 알림</h2>

      <p class="font-bold text-green-700">✅ 저장 완료!</p>
      <p class="text-green-600">파일이 성공적으로 저장되었습니다.</p>
    </div>

    <div
      class="w-70 mx-auto mt-20 shadow-lg border border-gray-200 rounded-lg overflow-hidden"
    >
      <h2 class="sr-only">제품 카드</h2>

      <div class="w-full h-40 bg-green-400"></div>
      <div class="w-full p-5">
        <h3 class="font-bold mb-2">애플 워치</h3>
        <h3 class="mb-4 text-xs text-gray-700">
          건강과 피트니스를 위한 스마트 워치
        </h3>
        <h3 class="text-2xl font-bold">₩599,000</h3>
      </div>
    </div>

    <div class="w-150 mx-auto mt-20 space-x-5">
      <h2 class="sr-only">버튼들</h2>

      <button
        class="rounded-lg bg-blue-700 text-white font-bold px-6 py-4 shadow-md"
      >
        기본 버튼
      </button>
      <button
        class="rounded-lg border text-gray-700 font-bold border-gray-200 px-6 py-4 shadow-md"
      >
        보조 버튼
      </button>
      <button
        class="rounded-full bg-red-600 text-white px-4 py-2 shadow-md"
      >
        삭제
      </button>
      <button
        class="rounded-xl bg-green-500 text-white font-bold px-8 py-6 shadow-md"
      >
        시작하기
      </button>
    </div>

    <div
      class="w-90 mx-auto mt-20 rounded-lg border-l-4 border-blue-600 p-8 shadow-2xl font-bold"
    >
      <h2 class="sr-only">방문자 수</h2>

      <h3 class="text-gray-700 mb-4">총 방문자 수</h3>
      <p class="text-4xl mb-4">12,345</p>
      <p class="text-green-600">지난 달 대비 +15%</p>
    </div>
    </div>

    <div
      class="w-100 mx-auto mt-20 mb-50 rounded-lg border border-gray-200 p-8 shadow-lg"
    >
      <h2 class="sr-only">글 카드</h2>

      <div class="bg-gray-300 w-15 h-15 rounded-full"></div>

      <div class="border-gray-200 border-b py-4 mb-4">
        <h3 class="font-bold text-xl mb-4">Tailwind CSS 시작하기</h3>
        <p class="text-gray-600 font-bold">유틸리티 퍼스트 CSS 프레임워크로 빠르게 스타일링 하는 방법을 알아보세요.</p>
      </div>
      <p class="text-gray-600 text-sm">2024년 3월 15일 작성</p>
      <p class="text-gray-600 text-sm">조회수 1,234</p>
    </div>
  </body>
</html>
