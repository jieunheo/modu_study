<!DOCTYPE html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>피보나치 수열</title>
  </head>
  <body>
    <script>
      // 특정 순서의 피보나치수열을 구하는 함수
      // 1, 1, 2, 3, 5, 8, 13, ...
      function fibonacciFunc(n) {
        if (n === 1 || n === 2) return 1;
        else {
          return fibonacciFunc(n - 1) + fibonacciFunc(n - 2);
        }
      }

      console.log(fibonacciFunc(5));

      // fibonacciFunc(5) -> fFunc(5)
      /**
       * fFunc(4) + fFunc(3)
       * (fFunc(3) + fFunc(2)=1) + (fFunc(2)=1 + fFunc(1)=1)
       * fFunc(2)=1 + fFunc(1)=1 + 3 = 5
       */

      const memory = [0, 0, 0, 0, 0, 0, 0];
      function fFuncM(n) {
        if (n === 1 || n === 2) return 1;
        else if (memory[n] !== 0) {
          return memory[n];
        } else {
          memory[n] = fFuncM(n - 1) + fFuncM(n - 2);
          return memory[n];
        }
      }
    </script>
  </body>
</html>
